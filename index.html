<!DOCTYPE html>

<style>
*{box-sizing:border-box}body{margin:0;min-width:320px;background:#f6f5f1;color:#272b24;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{max-width:1040px;width:calc(100% - 40px);margin:auto;padding:32px 0}header,.brand,.hero,.heading{display:flex;align-items:center;justify-content:space-between;gap:16px}header{margin-bottom:32px}.brand{justify-content:flex-start}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#687a55;color:white;font-size:22px}.brand p{margin:0}.brand strong{font-size:16px}.caption,.sub,.event p,.todo small{color:#85897e}.caption{font-size:12px;margin-top:3px!important}.date{padding:9px 14px;background:#fffefa;border:1px solid #e9e8e1;border-radius:24px;font-size:13px;white-space:nowrap}.hero{align-items:flex-end;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:#687a55;font-size:11px;font-weight:bold;letter-spacing:2px}h1{margin:0;font-size:clamp(26px,5vw,36px)}.hero-note{color:#85897e;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.8fr);align-items:start;gap:18px}.column{display:grid;gap:18px}.card{min-width:0;padding:22px;border:1px solid #e9e8e1;border-radius:18px;background:#fffefa}.heading{margin-bottom:15px}.heading h2{margin:0;font-size:17px}.sub{margin:4px 0 0;font-size:12px}.badge{padding:5px 9px;border-radius:20px;background:#eff2e9;color:#687a55;font-size:11px;white-space:nowrap}.event{display:grid;grid-template-columns:62px 3px 1fr;gap:13px;padding:14px 0;border-top:1px solid #f0efe9}.event:first-child{border:0}.event time{color:#687a55;font-size:13px;font-weight:bold}.event .bar{border-radius:5px;background:#d9dfce}.event:nth-child(2) .bar{background:#e6c3a7}.event h3{margin:0;font-size:14px}.event p{margin:5px 0 0;font-size:12px;line-height:1.6}.todos{display:grid;gap:9px}.todo{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #efeee8;border-radius:12px}.todo input{margin:2px 0 0;accent-color:#687a55}.todo strong{display:block;font-size:13px}.todo small{display:block;margin-top:4px;font-size:11px}.todo.done{background:#f8f9f5}.todo.done strong{text-decoration:line-through;color:#989b90}.todo.done small{color:#687a55}.form{display:grid;gap:12px}.field label{display:block;margin-bottom:5px;font-size:12px;font-weight:bold}.field input,.field textarea{width:100%;padding:10px 11px;border:1px solid #e8e7df;border-radius:10px;background:white;font:inherit;font-size:13px;min-height:42px}.field textarea{min-height:68px;resize:vertical}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:44px;border:0;border-radius:11px;background:#687a55;color:white;font-weight:bold;cursor:pointer}button:hover{background:#536443}@media(max-width:700px){.page{width:calc(100% - 28px);padding-top:22px}.layout{grid-template-columns:1fr;gap:14px}.column{gap:14px}.hero{align-items:flex-start;flex-direction:column;gap:2px;margin-bottom:18px}.hero-note{margin:0;font-size:12px}.card{padding:18px}}@media(max-width:380px){.date{font-size:11px;padding:8px}.card{padding:15px}.event{grid-template-columns:55px 3px 1fr;gap:10px}}

<section class="hero"><div><p class="eyebrow">MY DAILY PLANNER</p><h1>今天，慢慢來也很好。</h1></div><p class="hero-note">把重要的事一件一件完成，記得也照顧自己。</p></section>
<div class="layout"><div class="column">
<section class="card"><div class="heading"><div><h2>今日行程</h2><p class="sub">安排步調，讓一天更從容</p></div><span class="badge" id="event-count">3 個安排</span></div><div id="events">
<article class="event" data-time="09:00"><time>09:00</time><span class="bar"></span><div><h3>晨間散步與咖啡</h3><p>公園繞一圈，為自己準備一個舒服的早晨。</p></div></article>

<article class="event" data-time="18:30"><time>18:30</time><span class="bar"></span><div><h3>晚餐與家人相聚</h3><p>放下工作，好好享受一頓晚餐。</p></div></article>

<section class="card"><div class="heading"><div><h2>待辦清單</h2><p class="sub">完成一件，就值得給自己一個讚</p></div><span class="badge" id="todo-count">0 / 3 完成</span></div><div class="todos" id="todos">
